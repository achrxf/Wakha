<title>Wakha Darija</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#100E26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: one phone-width stage. A full-bleed vertical swipe feed of zellige-tiled cards,
     a slim glass HUD on top, a four-tab dock at the bottom, sheets that cover the feed. */
  /* night (dark-first) */
  --bg:#100E26; --bg-2:#0B0A1C; --surface:#1C1944; --surface-2:#27235A;
  --fg:#F5F2FF; --fg-soft:#B8B2E2; --fg-faint:#8A84BC;
  --line:rgba(245,242,255,.12); --glass:rgba(14,12,36,.58); --glass-line:rgba(255,255,255,.14);
  --gold-text:#FFC53D; --good:#1ED69C; --bad:#E0334F; --on-bad:#FFFFFF; --focus:#FFC53D;
  --scrim:rgba(9,7,26,.84);
  /* tile colors: content, identical in both themes */
  --t-cobalt:#2F3BEB; --t-saffron:#FFC53D; --t-emerald:#0A8259; --t-rose:#F7608A;
  --t-fez:#C9233C; --t-night:#1B1747; --t-mint:#1ED69C; --t-teal:#0D7480;
  --ink:#15112F; --paper:#FFFFFF; --tea:#D98A2B; --leaf:#22B573;
  --r-rare:#4FA8FF; --r-epic:#B46CFF; --r-legend:#FFC53D;
  --font-display:"Baloo Bhaijaan 2","Baloo 2",ui-rounded,"Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --font-ui:"Readex Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
  --hud-h:58px; --dock-h:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3EFFB; --bg-2:#E6E0F5; --surface:#FFFFFF; --surface-2:#EFEAFA;
    --fg:#15112F; --fg-soft:#544D7C; --fg-faint:#7A74A2;
    --line:rgba(21,17,47,.10); --glass:rgba(255,255,255,.76); --glass-line:rgba(21,17,47,.10);
    --gold-text:#8F6200; --bad:#D92D4C; --focus:#2F3BEB;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3EFFB; --bg-2:#E6E0F5; --surface:#FFFFFF; --surface-2:#EFEAFA;
  --fg:#15112F; --fg-soft:#544D7C; --fg-faint:#7A74A2;
  --line:rgba(21,17,47,.10); --glass:rgba(255,255,255,.76); --glass-line:rgba(21,17,47,.10);
  --gold-text:#8F6200; --bad:#D92D4C; --focus:#2F3BEB;
  color-scheme:light;
}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
p,h1,h2,h3{margin:0}
svg{display:block}

.stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:560px){
  body{background-color:var(--bg-2);background-image:var(--zl-page);background-size:96px 96px}
  .stage{box-shadow:0 0 0 1px var(--line),0 30px 90px rgba(0,0,0,.35)}
}

/* ---------- feed ---------- */
.feed{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;isolation:isolate;
  background:var(--tile);color:var(--tile-fg);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--pat);background-size:88px 88px;
  -webkit-mask-image:radial-gradient(120% 75% at 100% 0%,#000 10%,transparent 70%);mask-image:radial-gradient(120% 75% at 100% 0%,#000 10%,transparent 70%)}
.card::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;z-index:-1;background:linear-gradient(to top,var(--tile-deep),transparent)}
.t-cobalt{--tile:var(--t-cobalt);--tile-deep:#1F27B8;--tile-fg:var(--paper);--tile-soft:rgba(255,255,255,.8);--btn:rgba(255,255,255,.13);--btn-line:rgba(255,255,255,.26);--pat:var(--zl-light)}
.t-saffron{--tile:var(--t-saffron);--tile-deep:#F5A915;--tile-fg:var(--ink);--tile-soft:rgba(21,17,47,.72);--btn:rgba(255,255,255,.45);--btn-line:rgba(21,17,47,.14);--pat:var(--zl-dark)}
.t-emerald{--tile:var(--t-emerald);--tile-deep:#066043;--tile-fg:var(--paper);--tile-soft:rgba(255,255,255,.82);--btn:rgba(255,255,255,.13);--btn-line:rgba(255,255,255,.26);--pat:var(--zl-light)}
.t-rose{--tile:var(--t-rose);--tile-deep:#EC4677;--tile-fg:var(--ink);--tile-soft:rgba(21,17,47,.74);--btn:rgba(255,255,255,.38);--btn-line:rgba(21,17,47,.14);--pat:var(--zl-dark)}
.t-fez{--tile:var(--t-fez);--tile-deep:#97152A;--tile-fg:var(--paper);--tile-soft:rgba(255,255,255,.82);--btn:rgba(255,255,255,.13);--btn-line:rgba(255,255,255,.26);--pat:var(--zl-light)}
.t-night{--tile:var(--t-night);--tile-deep:#0F0C2E;--tile-fg:var(--paper);--tile-soft:rgba(255,255,255,.76);--btn:rgba(255,255,255,.1);--btn-line:rgba(255,255,255,.2);--pat:var(--zl-gold)}
.t-mint{--tile:var(--t-mint);--tile-deep:#12B57E;--tile-fg:var(--ink);--tile-soft:rgba(21,17,47,.72);--btn:rgba(255,255,255,.42);--btn-line:rgba(21,17,47,.14);--pat:var(--zl-dark)}
.t-teal{--tile:var(--t-teal);--tile-deep:#075660;--tile-fg:var(--paper);--tile-soft:rgba(255,255,255,.82);--btn:rgba(255,255,255,.13);--btn-line:rgba(255,255,255,.26);--pat:var(--zl-light)}

.card-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px;
  padding-top:calc(var(--hud-h) + 16px);padding-bottom:calc(var(--dock-h) + 20px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.card[data-type="learn"] .card-in,.card[data-type="drop"] .card-in{padding-right:max(84px,env(safe-area-inset-right,0px))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--font-ui);letter-spacing:.01em;padding:7px 11px;border-radius:999px;
  background:var(--btn);border:1px solid var(--btn-line);color:var(--tile-fg)}
.chip svg{width:14px;height:14px}
.chip-solid{background:var(--tile-fg);color:var(--tile);border-color:transparent}
.big{font:800 clamp(56px,19vw,96px)/.9 var(--font-display);letter-spacing:-.012em;overflow-wrap:anywhere;text-wrap:balance}
.big.l2{font-size:clamp(46px,14.5vw,74px)}
.big.l3{font-size:clamp(38px,11.5vw,58px);line-height:.98}
.ar{font:700 clamp(32px,10.5vw,54px)/1.3 var(--font-display);text-align:left;color:var(--tile-soft)}
.mean{margin-top:2px;font:600 clamp(20px,5.8vw,26px)/1.22 var(--font-ui);text-wrap:balance}
.lit{display:block;margin-top:4px;font:400 15px/1.4 var(--font-ui);color:var(--tile-soft)}
.ex{margin-top:6px;padding:12px 14px;border-radius:16px;background:var(--btn);border:1px solid var(--btn-line);max-width:30rem}
.ex-d{font:700 21px/1.2 var(--font-display)}
.ex-t{margin-top:2px;font:400 15px/1.38 var(--font-ui);color:var(--tile-soft)}
.note{display:flex;gap:10px;align-items:center;margin-top:2px;font:500 15px/1.42 var(--font-ui);color:var(--tile-soft);max-width:30rem}
.note .mc{flex:none;width:38px;height:38px}
.prompt{font:600 16px/1.3 var(--font-ui);color:var(--tile-soft)}
.prompt-big{font:700 clamp(28px,8.4vw,40px)/1.08 var(--font-display);text-wrap:balance}
.scene{display:flex;gap:14px;align-items:center}
.scene-emo{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--btn);border:1px solid var(--btn-line)}
.scene-txt{font:600 clamp(20px,5.8vw,25px)/1.25 var(--font-ui);text-wrap:balance}

/* options */
.opts{display:grid;gap:10px;margin-top:8px}
.opt{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:12px 16px;border-radius:16px;text-align:left;
  background:var(--btn);border:1.5px solid var(--btn-line);font:600 17px/1.25 var(--font-ui);color:var(--tile-fg);
  transition:transform .12s ease,background-color .2s,border-color .2s,opacity .2s}
.opt:active{transform:scale(.975)}
.opt .d{display:block;font:700 21px/1.15 var(--font-display)}
.opt .d-ar{display:block;font:600 14px/1.2 var(--font-display);opacity:.75}
.opt .tr{font:400 13.5px/1.3 var(--font-ui);opacity:.8;display:none}
.opts.done .opt .tr{display:block}
.opt.ok{background:var(--good);border-color:transparent;color:var(--ink)}
.opt.no{background:var(--bad);border-color:transparent;color:var(--on-bad)}
.opts.done .opt:not(.ok):not(.no){opacity:.5}
.opts.done .opt{pointer-events:none}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt-mark{flex:none;width:24px;height:24px;display:none}
.opt.ok .opt-mark,.opt.no .opt-mark{display:block}

.fb{display:flex;align-items:center;gap:10px;min-height:50px}
.fb .next{margin:0 0 0 auto;flex:none}
.fb:empty{display:none}
.fb .mc{flex:none;width:48px;height:48px}
.bubble{position:relative;padding:9px 13px;border-radius:16px;background:var(--paper);color:var(--ink);font:500 14.5px/1.35 var(--font-ui);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.bubble b{font:800 17px/1.1 var(--font-display);display:block}
.next{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:4px;padding:12px 18px;border-radius:999px;
  background:var(--tile-fg);color:var(--tile);font:700 15px/1 var(--font-ui)}
.next svg{width:18px;height:18px}

/* rail */
.rail{position:absolute;z-index:3;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--dock-h) + 26px);display:flex;flex-direction:column;gap:14px}
.rb{display:grid;justify-items:center;gap:5px;font:600 11.5px/1 var(--font-ui);color:var(--tile-fg)}
.rb .ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--btn);border:1px solid var(--btn-line);transition:transform .15s,background-color .2s}
.rb:active .ico{transform:scale(.9)}
.rb svg{width:26px;height:26px}
.rb.on .ico{background:var(--t-rose);border-color:transparent;color:var(--ink)}
.rb.speak{display:none}
.has-voice .rb.speak{display:grid}
.dt-hint{position:absolute;left:0;right:0;bottom:calc(var(--dock-h) + 30px);display:flex;justify-content:center;pointer-events:none;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(84px,env(safe-area-inset-right,0px))}
.dt-hint span{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--btn);border:1px solid var(--btn-line);font:600 13px/1 var(--font-ui)}
.dt-hint svg{width:18px;height:18px}
.heart-pop{position:absolute;z-index:4;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;color:var(--t-rose)}

/* builder */
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px;border-radius:18px;border:2px dashed var(--btn-line);align-content:flex-start}
.slots.ok{border-style:solid;border-color:var(--good);background:rgba(30,214,156,.16)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tok{padding:10px 15px;border-radius:14px;background:var(--paper);color:var(--ink);font:700 20px/1.1 var(--font-display);box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .12s}
.tok:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.tok.ghost{visibility:hidden}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}

/* reel */
.bars{position:absolute;z-index:3;top:calc(var(--hud-h) + 6px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:5px}
.bars i{flex:1;height:4px;border-radius:4px;background:var(--btn-line);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--tile-fg)}
.bars i.past b{width:100%}
.card.is-active .bars i.now b{animation:barfill var(--slide-ms,3800ms) linear forwards}
.card.paused .bars i.now b{animation-play-state:paused}
.slides{position:relative;flex:1;display:grid}
.slide{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;gap:14px;opacity:0;transform:translateX(18px);transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.slide.on{opacity:1;transform:none}
.card[data-type="reel"] .card-in{pointer-events:none;z-index:3}
.card[data-type="reel"] .slide.on button{pointer-events:auto}
.slide .emo{font-size:76px;line-height:1}
.slide .sbig{font:800 clamp(42px,13vw,70px)/.96 var(--font-display);overflow-wrap:anywhere;text-wrap:balance}
.slide .sbig.s1{font-size:clamp(76px,27vw,128px);line-height:.9}
.slide .sbig.s3{font-size:clamp(36px,10.5vw,54px)}
.slide .stxt{font:500 clamp(19px,5.4vw,23px)/1.38 var(--font-ui);max-width:28rem;text-wrap:pretty}
.reel-title{font:700 15px/1.2 var(--font-ui);color:var(--tile-soft)}
.tapzone{position:absolute;z-index:2;top:calc(var(--hud-h) + 20px);bottom:calc(var(--dock-h) + 90px)}
.tapzone.l{left:0;width:34%}.tapzone.r{right:0;width:66%}

/* goal pick + welcome */
.picks{display:grid;gap:10px}
.pick{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--btn);border:1.5px solid var(--btn-line);text-align:left}
.pick .gl{flex:none;width:34px;height:44px}
.pick b{display:block;font:800 22px/1.1 var(--font-display)}
.pick span{font:500 14px/1.3 var(--font-ui);color:var(--tile-soft)}
.pick.sel{background:var(--tile-fg);color:var(--tile);border-color:transparent}
.pick.sel span{color:inherit;opacity:.8}
.vibes{display:flex;flex-wrap:wrap;gap:8px}
.vibe{padding:11px 16px;border-radius:999px;background:var(--btn);border:1.5px solid var(--btn-line);font:600 15px/1 var(--font-ui)}
.vibe.sel{background:var(--paper);color:var(--ink);border-color:transparent}
.hero-cat{width:min(46vw,190px);height:auto;margin-left:-8px}
.swipe-cue{display:flex;align-items:center;gap:8px;font:600 14px/1 var(--font-ui);color:var(--tile-soft)}
.swipe-cue svg{width:22px;height:22px}

/* mystery */
.center{align-items:center;text-align:center}
.chest{width:min(62vw,250px);height:auto;cursor:pointer;overflow:visible;filter:drop-shadow(0 18px 40px rgba(255,197,61,.28));transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.chest.open{width:min(40vw,150px)}
.chest .lid{transform-origin:24px 70px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.chest.open .lid{transform:rotate(-26deg) translate(-2px,-6px)}
.card .chest.wobble{animation:wobble .6s ease-in-out}
.glow{position:absolute;inset:0;z-index:-1;background:radial-gradient(42% 32% at 50% 46%,rgba(255,197,61,.35),transparent 70%);pointer-events:none}
.reward{display:grid;justify-items:center;gap:10px}
.reward[hidden]{display:none}
.r-title{font:800 clamp(30px,9vw,44px)/1.02 var(--font-display);text-wrap:balance}
.r-sub{font:500 16px/1.4 var(--font-ui);color:var(--tile-soft);max-width:22rem}
.tcard{position:relative;width:min(70vw,250px);padding:20px 18px 18px;border-radius:22px;background:var(--paper);color:var(--ink);text-align:left;
  box-shadow:0 0 0 3px var(--rc,var(--r-rare)),0 0 44px var(--rc,var(--r-rare))}
.tcard .rl{font:700 11.5px/1 var(--font-ui);letter-spacing:.08em;color:var(--rc-ink,#1B5FB0)}
.tcard .tw{margin-top:8px;font:800 34px/1 var(--font-display)}
.tcard .ta{margin-top:4px;font:700 24px/1.3 var(--font-display);color:#544D7C}
.tcard .tm{margin-top:6px;font:500 15px/1.35 var(--font-ui)}
.rar-rare{--rc:var(--r-rare);--rc-ink:#1B5FB0}
.rar-epic{--rc:var(--r-epic);--rc-ink:#6E2BC2}
.rar-legend{--rc:var(--r-legend);--rc-ink:#8F6200}

/* rare drop flip */
.flip{width:min(70vw,250px);aspect-ratio:3/4;max-width:100%;perspective:900px;cursor:pointer}
.flip-in{display:block;position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.open .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.face.back{background:var(--t-cobalt);background-image:var(--zl-gold);background-size:56px 56px;box-shadow:0 0 0 3px var(--rc),0 0 50px var(--rc)}
.face.back .q{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--t-night);color:var(--r-legend);font:800 48px/1 var(--font-display);box-shadow:0 0 0 3px var(--rc)}
.face.front{transform:rotateY(180deg);background:var(--paper);color:var(--ink);place-items:stretch;align-content:center;padding:22px 18px;box-shadow:0 0 0 3px var(--rc),0 0 50px var(--rc)}
.shimmer{position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shim 2.4s ease-in-out infinite}

/* lightning */
.timer{height:10px;border-radius:10px;background:var(--btn);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--t-saffron);transform-origin:left center}
.lstate{font:600 14px/1 var(--font-ui);color:var(--tile-soft);display:flex;justify-content:space-between}
.lq{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.lq .w{font:800 clamp(44px,14vw,66px)/.95 var(--font-display)}
.lq .m{font:600 22px/1.25 var(--font-ui)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf button{min-height:66px;border-radius:18px;font:800 22px/1 var(--font-display);display:flex;align-items:center;justify-content:center;gap:8px}
.tf .yes{background:var(--good);color:var(--ink)}
.tf .no{background:var(--paper);color:var(--ink)}
.tf svg{width:24px;height:24px}
.bolt{width:96px;height:96px;color:var(--t-saffron);filter:drop-shadow(0 0 22px rgba(255,197,61,.55))}
.big-cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 28px;border-radius:999px;background:var(--tile-fg);color:var(--tile);font:800 21px/1 var(--font-display)}

/* haggle */
.h-head{display:flex;align-items:center;gap:10px}
.h-head .face-v{width:46px;height:46px;flex:none}
.h-head b{display:block;font:800 19px/1.1 var(--font-display)}
.h-head span{font:500 13px/1.2 var(--font-ui);color:var(--tile-soft)}
.h-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:18px;background:var(--btn);border:1px solid var(--btn-line)}
.h-item svg{width:96px;height:auto;flex:none}
.tag{text-align:right}
.tag .p{font:800 clamp(40px,12vw,56px)/.9 var(--font-display);font-variant-numeric:tabular-nums}
.tag .p small{font-size:.42em;margin-left:4px}
.tag .was{font:600 14px/1.2 var(--font-ui);color:var(--tile-soft);text-decoration:line-through;min-height:17px}
.chat{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-height:0;overflow:hidden}
.h-start{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding-bottom:6px}
.result{flex:1;align-content:center}
.msg{max-width:88%;padding:10px 13px;border-radius:18px;font:500 14px/1.32 var(--font-ui);animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
.msg .d{display:block;font:700 18px/1.2 var(--font-display)}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const li = () => (S.lang === "fr" ? 1 : 0);
const L = (pair) => (Array.isArray(pair) ? (pair[li()] ?? pair[0]) : pair);
const t = (k, vars) => { let s = (UI[S.lang] && UI[S.lang][k]) ?? UI.en[k] ?? k; if (vars && typeof s === "string") for (const [a, b] of Object.entries(vars)) s = s.split("{" + a + "}").join(b); return s; };
const meaning = (wd) => (S.lang === "fr" ? wd.fr : wd.en);
const exTr = (ex) => (S.lang === "fr" ? ex[2] : ex[1]);
const triTr = (tri) => (S.lang === "fr" ? tri[2] : tri[1]);

const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => dayKey(new Date());
const addDays = (key, n) => { const [y, m, d] = key.split("-").map(Number); return dayKey(new Date(y, m - 1, d + n)); };
const diffDays = (a, b) => { const [y1, m1, d1] = a.split("-").map(Number); const [y2, m2, d2] = b.split("-").map(Number); return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 864e5); };
const dayRec = (k = today()) => (S.days[k] ||= { xp:0, n:0, c:0, w:0, goalMet:false });

function levelInfo(xp) {
  let i = 0;
  while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1][0]) i++;
  let base = LEVELS[i][0], nextAt = i + 1 < LEVELS.length ? LEVELS[i + 1][0] : null;
  let n = i + 1, title = L([LEVELS[i][1], LEVELS[i][2]]);
  if (nextAt === null) {
    const extra = Math.floor((xp - base) / LEVEL_STEP);
    n += extra; base += extra * LEVEL_STEP; nextAt = base + LEVEL_STEP;
    if (extra > 0) title += " " + "★".repeat(Math.min(extra, 5));
  }
  return { n, title, raw: LEVELS[Math.min(i, LEVELS.length - 1)][1], base, nextAt, pct: Math.min(1, (xp - base) / (nextAt - base)) };
}
function shownStreak() {
  if (!S.lastGoalDay) return 0;
  const d = diffDays(S.lastGoalDay, today());
  if (d <= 1) return S.streak;
  if (d === 2 && S.shields > 0) return S.streak;
  return 0;
}

function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) return o; } } catch (e) {} return null; }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
const Remote = { ref:null, busy:false, again:false, off:false };
async function remoteSave() {
  if (!Remote.ref || Remote.off) return;
  if (Remote.busy) { Remote.again = true; return; }
  Remote.busy = true;
  try { await Remote.ref.set(JSON.parse(JSON.stringify(S))); }
  catch (e) { if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted" || e.code === "quota_exceeded")) Remote.off = true; }
  Remote.busy = false;
  if (Remote.again) { Remote.again = false; remoteSave(); }
}
let saveTimer = null, remoteTimer = null;
function persist() {
  S.updatedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLocal, 600);
  if (Remote.ref && !remoteTimer) remoteTimer = setTimeout(() => { remoteTimer = null; remoteSave(); }, 4000);

    const ready = this.pending.filter((p) => p.at <= i && !this.reserved.has(p.w) && S.words[p.w]);
    if (!ready.length) return null;
    ready.sort((a, b) => a.at - b.at);
    const p = ready[0];
    this.pending = this.pending.filter((x) => x !== p);

  },
  since(type, i) { return this.lastIdx[type] == null ? 999 : i - this.lastIdx[type]; },
  pickSpecial(i, any) {
    if (!any && i - this.lastSpecial < this.gap) return null;
    const known = Object.keys(S.words).length;
    const missing = COLL.filter((id) => !S.kenz[id] && !this.reserved.has(id));
    const sinceSurprise = Math.min(this.since("mystery", i), this.since("drop", i), this.since("haggle", i));
    // a surprise is never more than ~14 cards away
    if (i >= 8 && sinceSurprise >= 14) {
      this.gap = rand(3, 5);
      if (missing.length && i >= 14 && Math.random() < 0.45) { const w = pick(missing); this.reserved.add(w); return { t:"drop", w }; }
      return { t:"mystery" };
    }
    const cand = [];
    const add = (sp, wgt) => cand.push([sp, wgt]);
    const reel = this.freshest(REELS.map((r) => r[0]), "r:");
    if (reel && this.since("reel", i) >= 7) add({ t:"reel", id:reel }, 2);
    if (known >= 4 && this.since("build", i) >= 5) { const b = this.freshest(BUILDS.map((x) => x[0]), "b:"); if (b) add({ t:"build", id:b }, 3); }
    if (this.since("sit", i) >= 4) { const s2 = this.freshest(SITS.map((x) => x[0]), "s:"); if (s2) add({ t:"sit", id:s2 }, 4); }
    if (i >= 8 && this.since("mystery", i) >= 10) add({ t:"mystery" }, 2);
    if (known >= 8 && this.since("lightning", i) >= 14) add({ t:"lightning" }, 2);
    if (known >= 6 && this.since("haggle", i) >= 22) add({ t:"haggle", item:pick(HAGGLE).id }, S.stats.haggles ? 2 : 5);
    if (i >= 14 && missing.length && this.since("drop", i) >= 12) add({ t:"drop", w:pick(missing) }, 2);
    if (!cand.length) return null;

    let tot = cand.reduce((a, c) => a + c[1], 0), r = Math.random() * tot;

  },
  freshest(ids, prefix) {
    const inUse = new Set(Feed.cards.filter((c) => !c.seen).map((c) => c.spec.id).filter(Boolean));
    const avail = ids.filter((id) => !inUse.has(id));
    if (!avail.length) return null;
    avail.sort((a, b) => (S.shown[prefix + a] || 0) - (S.shown[prefix + b] || 0) || Math.random() - 0.5);

  pickDue(i) {
    if (this.lastTwoQuiz()) return null;
    const recentW = new Set(Feed.cards.slice(-6).map((c) => c.spec.w).filter(Boolean));
    const due = dueWords().filter((id) => !recentW.has(id) && !this.reserved.has(id));
    if (!due.length) return null;
    due.sort((a, b) => S.words[a].b - S.words[b].b || S.words[a].due.localeCompare(S.words[b].due));

  pickNew() {

  },
  pickAny() {

const Feed = {
  el:null, cards:[], active:-1, io:null,
  init() {
    this.el = $("#feed");
    this.io = new IntersectionObserver((es) => {
      for (const e of es) if (e.isIntersecting && e.intersectionRatio >= 0.6) this.setActive(+e.target.dataset.i);
    }, { root:this.el, threshold:[0.6] });
  },
  push() {
    const sp = Gen.next();
    const card = makeCard(sp);
    card.spec = sp; card.i = this.cards.length; card.seen = false;
    card.el.dataset.i = card.i;
    this.cards.push(card);
    this.el.appendChild(card.el);
    this.io.observe(card.el);
  },
  ensureAhead() { while (this.cards.length < this.active + 4) this.push(); },
  setActive(i) {
    if (i === this.active || !this.cards[i]) return;
    const prev = this.cards[this.active];
    if (prev) { prev.el.classList.remove("is-active"); prev.leave && prev.leave(); }
    this.active = i;
    const c = this.cards[i];
    c.el.classList.add("is-active");
    if (!c.seen) {
      c.seen = true; if (this.booted) c.el.classList.add("play");
      if (!S.onboarded && i >= 1) S.onboarded = true;
      S.stats.cards++; dayRec().n++;
      if (c.spec.t === "learn") Gen.reserved.delete(c.spec.w);
      if (c.spec.t === "drop") Gen.reserved.delete(c.spec.w);
      if (c.spec.id) S.shown[({ reel:"r:", build:"b:", sit:"s:" }[c.spec.t] || "x:") + c.spec.id] = Date.now();
      c.firstEnter && c.firstEnter();
      persist();
    }
    c.enter && c.enter();
    this.booted = true;
    this.ensureAhead();
    // a celebration that was waiting opens at the card change, before this card can be tapped
    if (Session.overlayQ.length && !Session.overlayOpen) { clearTimeout(Session.ovTimer); nextOverlay(); }
  },
  go(delta) { const c = this.cards[this.active + delta]; if (c) this.el.scrollTo({ top:c.el.offsetTop, behavior:reduced ? "auto" : "smooth" }); },
  next() { this.go(1); },
  rebuildAhead(keep = true, front = null) {
    const removed = [];

      const c = this.cards[j]; if (c.seen) break;
      this.io.unobserve(c.el); c.el.remove(); this.cards.pop();
      if (c.spec.t === "learn" || c.spec.t === "drop") Gen.reserved.delete(c.spec.w);
      removed.unshift(c.spec);
    }
    if (keep) Gen.requeue = removed.concat(Gen.requeue);

};
function restartFeed() {
  Feed.cards.forEach((c) => { Feed.io.unobserve(c.el); c.el.remove(); });
  Feed.cards = []; Feed.active = -1; combo = 0;
  Gen.reset();
  const t0 = today();
  const newDay = S.lastOpen && S.lastOpen !== t0;
  if (S.lastOpen !== t0) { S.lastOpen = t0; S.dayCount = (S.dayCount || 0) + 1; }
  Gen.buildOpener(newDay);
  Feed.el.scrollTop = 0;
  for (let k = 0; k < 4; k++) Feed.push();
  refreshHUD(); renderCombo(); refreshTabs();
}

function makeCard(sp) {

function wireWordCard(card, wd) {
  const el = card.el;
  let lastTap = 0, lx = 0, ly = 0;
  const doSave = (x, y, fromBtn) => {
    const s = S.words[wd.id] || introduce(wd.id);
    const btn = $(".rb.heart", el);
    if (fromBtn && s.fav) { s.fav = false; btn.classList.remove("on"); $(".ico", btn).innerHTML = ICON.heartLine; persist(); return; }
    const first = !s.fav;
    s.fav = true; btn.classList.add("on"); $(".ico", btn).innerHTML = ICON.heart;
    Session.interacted = true;
    Sound.play("heart");
    if (x != null) {
      const hp = document.createElement("div"); hp.className = "heart-pop"; hp.innerHTML = ICON.heart;
      hp.style.left = x + "px"; hp.style.top = y + "px"; el.appendChild(hp);
      hp.animate([{ transform:"scale(.2) rotate(-12deg)", opacity:0 }, { transform:"scale(1.15) rotate(-6deg)", opacity:1, offset:0.25 }, { transform:"scale(.95)", opacity:1, offset:0.55 }, { transform:"scale(1.25) translateY(-60px)", opacity:0 }], { duration:850, easing:"ease-out" }).onfinish = () => hp.remove();

      else if (b.dataset.act === "share") shareThing({ kind:"word", word:wd }, b);

    const now = performance.now(), r = el.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;

    else { lastTap = now; lx = x; ly = y; }
  });
}

function makeOptions(wd, reverse, easy) {
  const pool = CORE.concat(COLL.filter((id) => S.kenz[id])).filter((id) => id !== wd.id && !(wd.grp && W[id].grp === wd.grp));
  const label = (x) => (reverse ? W[x].d : meaning(W[x]));
  const used = new Set([label(wd.id)]);
  const sameCat = shuffle(pool.filter((id) => W[id].cat === wd.cat));
  const other = shuffle(pool.filter((id) => W[id].cat !== wd.cat));
  const order = easy ? other : sameCat.slice(0, 2).concat(shuffle(sameCat.slice(2).concat(other)));
  const picks = [];
  for (const id of order) { const lb = label(id); if (used.has(lb)) continue; used.add(lb); picks.push(id); if (picks.length === 3) break; }
  return shuffle([wd.id].concat(picks));
}

    <div class="picks a4">${g.map(([n, k, p]) => `<button class="pick ${S.goal === n && S.goalChosen ? "sel" : ""}" data-n="${n}">${teaGlass(p, "gl")}<span><b>${esc(t(k))}</b><span>${esc(t("perDay", { n }))}</span></span></button>`).join("")}</div>
    <p class="r-sub a5" style="text-align:left;font-size:14px">${esc(t("goalNote"))}</p>`;
  const card = { el, chosen:false };
  el.addEventListener("click", (e) => {

    S.goal = +b.dataset.n;
    const first = !S.goalChosen; S.goalChosen = true; Session.interacted = true;
    if (first) award(3, b); else { refreshHUD(); persist(); }

}

function cardComeback() {

    <div class="chips a1"><span class="chip chip-solid">${esc(t("comebackK"))}</span></div>

/* =========================================================
   HUD, TABS, SHEETS
   ========================================================= */
function refreshHUD() {
  const st = shownStreak();
  const sEl = $("#hud-streak");
  sEl.innerHTML = flameSVG() + `<b>${st}</b>`;
  sEl.classList.toggle("cold", !dayRec().goalMet);
  sEl.setAttribute("aria-label", st + " " + t("stStreak"));
  const rec = dayRec(), pct = Math.min(1, rec.xp / S.goal);
  const gEl = $("#hud-goal");
  gEl.innerHTML = teaGlass(pct, "gl") + `<span class="bar"><i style="width:${(pct * 100).toFixed(1)}%"></i></span><b>${Math.min(rec.xp, 999)}/${S.goal}</b>`;
  gEl.classList.toggle("full", pct >= 1);
  gEl.setAttribute("aria-label", t("goalK") + ": " + rec.xp + "/" + S.goal + " XP");
  const li2 = levelInfo(S.xp);
  const C = 2 * Math.PI * 17;
  $("#hud-lvl").innerHTML = `<svg viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="17" fill="none" style="stroke:var(--line)" stroke-width="3"/><circle cx="19" cy="19" r="17" fill="none" style="stroke:var(--t-saffron);transition:stroke-dashoffset .6s" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - li2.pct)).toFixed(2)}"/></svg><b>${li2.n}</b>`;
  $("#hud-lvl").setAttribute("aria-label", t("meLevel", { n:li2.n }) + ", " + li2.title);
  refreshTabs();
}
function refreshTabs() {
  const tabs = { feed:ICON.feed, words:ICON.words, kenz:ICON.kenz, me:ICON.me };
  for (const k of Object.keys(tabs)) {
    const b = $("#tab-" + k);
    const badge = k === "words" ? dueWords().length : 0;
    b.innerHTML = tabs[k] + `<span>${esc(t(k))}</span>` + (k === "words" ? `<i class="badge" ${badge ? "" : "hidden"}>${badge}</i>` : "");
  }
}
let openTab = "feed";
function setTab(k) {
  if (k === openTab && k !== "feed") k = "feed";
  openTab = k;
  $$(".tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === k));
  ["words", "kenz", "me"].forEach((s) => { const el = $("#sheet-" + s); el.hidden = s !== k; if (s === k) { el.classList.remove("in"); void el.offsetWidth; el.classList.add("in"); el.scrollTop = 0; } });
  $("#hud").style.visibility = k === "feed" ? "" : "hidden";
  if (k === "words") renderWords();
  if (k === "kenz") renderKenz();
  if (k === "me") renderMe();
  if (k === "feed") { const c = Feed.cards[Feed.active]; c && c.enter && c.enter(); }
  else { const c = Feed.cards[Feed.active]; c && c.leave && c.leave(); }
}
let wordsFilter = "all";
function renderWords() {
  const el = $("#sheet-words");
  const ids = Object.keys(S.words).sort((a, b) => (S.words[b].last || 0) - (S.words[a].last || 0) || (S.words[b].intro || "").localeCompare(S.words[a].intro || ""));
  const learned = ids.filter((id) => S.words[id].b >= 1).length, mastered = ids.filter((id) => S.words[id].b >= 4).length;
  const due = dueWords();
  const list = wordsFilter === "due" ? ids.filter((id) => due.includes(id)) : ids;
  el.innerHTML = `
    <div class="sh-head"><div><h2>${esc(t("wordsT"))}</h2><p class="sh-sub">${esc(t("wordsS", { a:learned, b:mastered }))}</p></div>
      <div class="seg"><button data-f="all" class="${wordsFilter === "all" ? "on" : ""}">${esc(t("all"))}</button><button data-f="due" class="${wordsFilter === "due" ? "on" : ""}">${esc(t("dueTab"))}</button></div></div>
    <button class="cta" data-act="review" ${due.length ? "" : "disabled"}>${esc(due.length ? t("reviewDue", { n:due.length }) : t("nothingDue"))}</button>
    <div class="list">${list.length ? list.map((id) => { const wd = W[id], s = S.words[id]; return `<button class="wrow" data-id="${esc(id)}"><span class="wd" lang="ary-Latn">${esc(wd.d)}</span>${due.includes(id) ? `<span class="due">${esc(t("dueTab"))}</span>` : `<span class="dots" aria-label="${s.b}/5">${[1, 2, 3, 4, 5].map((k) => `<i class="${s.b >= k ? "f" : ""}"></i>`).join("")}</span>`}<span class="wa" dir="rtl" lang="ary" style="text-align:left">${esc(wd.ar)}</span><span></span><span class="wm">${esc(meaning(wd))}</span>${wd.ex ? `<span class="wx"><b lang="ary-Latn">${esc(wd.ex[0])}</b> (${esc(exTr(wd.ex))})</span>` : wd.note ? `<span class="wx">${esc(L(wd.note))}</span>` : ""}</button>`; }).join("") : `<div class="empty">${mascot("normal")}${esc(wordsFilter === "due" ? t("emptyDue") : t("emptyWords"))}</div>`}</div>`;
  el.onclick = (e) => {
    const f = e.target.closest("[data-f]"); if (f) { wordsFilter = f.dataset.f; renderWords(); return; }
    const r = e.target.closest("[data-act=review]"); if (r && due.length) { Gen.force = due.slice(0, 12); setTab("feed"); Feed.rebuildAhead(false); setTimeout(() => Feed.next(), 120); return; }
    const row = e.target.closest(".wrow"); if (row) { row.classList.toggle("open"); if (S.sound && Voice.v) Voice.say(W[row.dataset.id].ar); }
  };
}
function renderKenz() {
  const el = $("#sheet-kenz");
  const got = COLL.filter((id) => S.kenz[id]).length;
  const order = { rare:0, epic:1, legend:2 };
  const ids = COLL.slice().sort((a, b) => order[W[a].rar] - order[W[b].rar]);
  el.innerHTML = `
    <div class="sh-head"><div><h2>${esc(t("kenzT"))}</h2><p class="sh-sub">${esc(t("kenzS"))}</p></div></div>
    <p style="font:700 14px/1 var(--font-ui);margin:4px 0 8px">${esc(t("found", { a:got, b:COLL.length }))}</p>
    <div class="prog"><i style="width:${((got / COLL.length) * 100).toFixed(1)}%"></i></div>
    <div class="kgrid">${ids.map((id) => { const wd = W[id], has = !!S.kenz[id]; return `<div class="kc rar-${wd.rar} ${has ? "got" : "miss"}"><p class="rl">${esc(L(RAR[wd.rar]).toUpperCase())}</p>${has ? `<div><p class="kw" lang="ary-Latn">${esc(wd.d)}</p><p class="ka" dir="rtl" lang="ary" style="text-align:left">${esc(wd.ar)}</p></div><p class="km">${esc(meaning(wd))}</p>` : `<p class="kw">?</p><p class="km">${esc(t("hidden"))}</p>`}</div>`; }).join("")}</div>`;
}
function weekChart() {
  const days = []; const d0 = today();
  for (let k = 6; k >= 0; k--) { const key = addDays(d0, -k); const [y, m, d] = key.split("-").map(Number); days.push({ key, xp:(S.days[key] || {}).xp || 0, dow:new Date(y, m - 1, d).getDay() }); }
  const max = Math.max(S.goal, ...days.map((x) => x.xp)) * 1.15;
  const Wc = 320, Hc = 150, top = 20, bot = 24, ph = Hc - top - bot, bw = 28, gapX = (Wc - 7 * bw) / 6;
  const gy = top + ph - (S.goal / max) * ph;
  const bars = days.map((x, i) => {
    const hgt = Math.max(3, (x.xp / max) * ph), xx = i * (bw + gapX), yy = top + ph - hgt, isT = i === 6;
    return `<rect x="${xx.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw}" height="${hgt.toFixed(1)}" rx="7" style="fill:${isT ? "var(--t-saffron)" : x.xp >= S.goal ? "var(--good)" : "var(--surface-2)"}"/>
      <text x="${(xx + bw / 2).toFixed(1)}" y="${Hc - 6}" text-anchor="middle" class="${isT ? "lbl" : ""}">${esc(UI[S.lang].daysShort[x.dow])}</text>
      ${isT || x.xp > 0 ? `<text x="${(xx + bw / 2).toFixed(1)}" y="${(yy - 6).toFixed(1)}" text-anchor="middle" class="${isT ? "lbl" : ""}">${x.xp}</text>` : ""}`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${Wc} ${Hc}" width="100%" role="img" aria-label="${esc(t("week"))}"><line x1="0" x2="${Wc}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" style="stroke:var(--fg-faint)" stroke-dasharray="4 4" stroke-width="1"/>${bars}</svg>`;
}
function renderMe() {
  const el = $("#sheet-me");
  const li2 = levelInfo(S.xp);
  const learned = Object.values(S.words).filter((s) => s.b >= 1).length;
  const tot = S.stats.correct + S.stats.wrong;
  const acc = tot ? Math.round((S.stats.correct / tot) * 100) + "%" : "–";
  const bd = S.stats.bestDeal;
  el.innerHTML = `
    <div class="me-top">${mascot("happy")}<div style="min-width:0;flex:1"><p class="sh-sub" style="margin:0 0 4px">${esc(t("meLevel", { n:li2.n }))}</p><h2>${esc(li2.title)}</h2>
      <div class="lvlbar"><i style="width:${(li2.pct * 100).toFixed(1)}%"></i></div><p class="sh-sub">${esc(t("xpToNext", { n:li2.nextAt - S.xp, l:li2.n + 1 }))}</p></div></div>
    <div class="stats">
      <div class="stat"><b>${shownStreak()}</b><span>${esc(t("stStreak"))}</span></div>
      <div class="stat"><b>${S.best}</b><span>${esc(t("stBest"))}</span></div>
      <div class="stat"><b>${learned}</b><span>${esc(t("stWords"))}</span></div>
      <div class="stat"><b>${acc}</b><span>${esc(t("stAcc"))}</span></div>
    </div>
    <div class="panel"><h3>${esc(t("week"))}</h3>${weekChart()}</div>
    <div class="panel"><h3>${esc(t("bestDeal"))}</h3><p style="font:500 15px/1.4 var(--font-ui);color:var(--fg-soft)">${bd ? esc(t("paid", { p:bd.price, s:bd.start })) : esc(t("none"))}</p></div>
    <div class="panel"><h3>${esc(t("settings"))}</h3>
      <div class="setrow"><span>${esc(t("lang"))}</span><div class="seg"><button data-lang="en" class="${S.lang === "en" ? "on" : ""}">English</button><button data-lang="fr" class="${S.lang === "fr" ? "on" : ""}">Français</button></div></div>
      <div class="setrow"><span>${esc(t("sound"))}</span><button class="switch" role="switch" id="sw-sound" aria-checked="${S.sound}" aria-label="${esc(t("sound"))}"></button></div>
      <div class="setrow"><span>${esc(t("goalSet"))}</span><div class="seg">${[75, 150, 300].map((n) => `<button data-goal="${n}" class="${S.goal === n ? "on" : ""}">${n}</button>`).join("")}</div></div>
      <div class="setrow" style="display:block"><button class="danger" data-act="reset">${esc(t("reset"))}</button>
        <div class="confirm" hidden><p style="font:500 14px/1.4 var(--font-ui);color:var(--fg-soft)">${esc(t("resetQ"))}</p><div class="row-btns"><button class="btn-bad" data-act="erase">${esc(t("erase"))}</button><button class="btn-plain" data-act="cancel">${esc(t("cancel"))}</button></div></div></div>
    </div>
    <p class="foot">${esc(t("audioNote"))}</p>`;
  el.onclick = (e) => {
    const lg = e.target.closest("[data-lang]");
    if (lg) { S.lang = lg.dataset.lang; persist(); renderMe(); refreshHUD(); Feed.rebuildAhead(); return; }
    const gl = e.target.closest("[data-goal]");
    if (gl) { S.goal = +gl.dataset.goal; S.goalChosen = true; checkGoal(); persist(); renderMe(); refreshHUD(); return; }
    if (e.target.closest("#sw-sound")) { S.sound = !S.sound; persist(); renderMe(); if (S.sound) { Sound.unlock(); Sound.play("good"); } return; }
    const a = e.target.closest("[data-act]");
    if (!a) return;
    if (a.dataset.act === "reset") $(".confirm", el).hidden = false;
    if (a.dataset.act === "cancel") $(".confirm", el).hidden = true;
    if (a.dataset.act === "erase") {
      const lang = S.lang; S = defaultState(); S.lang = lang; saveLocal(); remoteSave();
      setTab("feed"); restartFeed();
    }
  };
}

/* =========================================================
   BOOT
   ========================================================= */
function start(data) {
  installPatterns();
  const fromHot = data && data.S && data.S.v === 1 ? data.S : null;
  S = Object.assign(defaultState(), fromHot || loadLocal() || {});
  S.stats = Object.assign(defaultState().stats, S.stats || {});
  FX.init(); Voice.init(); Feed.init();
  restartFeed();
  $$(".tab").forEach((b) => b.addEventListener("click", () => { Sound.unlock(); Sound.play("tap"); setTab(b.dataset.tab); }));
  ["#hud-streak", "#hud-goal", "#hud-lvl"].forEach((s) => $(s).addEventListener("click", () => { Sound.unlock(); setTab("me"); }));
  $("#nav-up").innerHTML = ICON.up; $("#nav-down").innerHTML = ICON.down;
  $("#nav-hint").textContent = S.lang === "fr" ? "Ou les flèches du clavier" : "Or use the arrow keys";
  $("#nav-up").addEventListener("click", () => { Sound.unlock(); if (openTab !== "feed") setTab("feed"); Feed.go(-1); });
  $("#nav-down").addEventListener("click", () => { Sound.unlock(); if (openTab !== "feed") setTab("feed"); Feed.go(1); });
  addEventListener("pointerdown", () => Sound.unlock(), { once:true, capture:true });
  addEventListener("keydown", (e) => {
    if (openTab !== "feed" || !$("#overlay").hidden) { if (e.key === "Escape" && openTab !== "feed") setTab("feed"); return; }
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (["ArrowDown", "PageDown", "j"].includes(e.key)) { e.preventDefault(); Feed.go(1); }
    else if (["ArrowUp", "PageUp", "k"].includes(e.key)) { e.preventDefault(); Feed.go(-1); }
    else if (/^[1-4]$/.test(e.key)) { const c = Feed.cards[Feed.active]; const b = c && $$(".opts .opt, .h-opts .opt", c.el)[+e.key - 1]; b && b.click(); }
  });
  document.addEventListener("visibilitychange", () => {
    const c = Feed.cards[Feed.active]; if (!c) return;
    if (document.hidden) { flushSaves(); c.leave && c.leave(); } else if (openTab === "feed") c.enter && c.enter();
  });
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ S })); } catch (e) {}
  connectCapabilities();
  window.__wakha = { get S() { return S; }, Feed, Gen, W, COLL, CORE, today, levelInfo, dueWords, setTab,
    inject(sp) { Feed.rebuildAhead(true, sp); } };
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === "function") hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
