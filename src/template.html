/*CSS*/

<div class="stage" id="stage">
  <section class="view" id="v-today" aria-label="Today"></section>
  <section class="view" id="v-journey" aria-label="Journey" hidden></section>
  <section class="view" id="v-feed" aria-label="Feed" hidden><main class="feed" id="feed"></main></section>
  <section class="view" id="v-guide" aria-label="Guide" hidden></section>
  <section class="view" id="v-me" aria-label="Me" hidden></section>

  <header class="hud" id="hud">
    <div class="hud-in">
      <div class="hud-mark" id="hud-mark"></div>
      <button class="pill p-streak cold" id="hud-streak" aria-label="Tea tray"></button>
      <button class="pill p-goal" id="hud-goal" aria-label="Daily goal"></button>
      <div class="combo" id="combo" hidden></div>
      <div class="boost" id="boost" hidden></div>
      <button class="pill p-lvl" id="hud-lvl" aria-label="Level"></button>
    </div>
  </header>

  <div class="sheet-scrim" id="sheet-scrim" hidden></div>
  <div class="nsheet" id="nsheet" hidden></div>

  <nav class="dock" aria-label="Sections">
    <div class="dock-in">
      <button class="tab on" data-tab="today" id="tab-today"></button>
      <button class="tab" data-tab="journey" id="tab-journey"></button>
      <button class="tab" data-tab="feed" id="tab-feed"></button>
      <button class="tab" data-tab="guide" id="tab-guide"></button>
      <button class="tab" data-tab="me" id="tab-me"></button>
    </div>
  </nav>

  <div class="lesson" id="lesson" hidden></div>
  <div class="welcome" id="welcome" hidden></div>
  <div class="overlay" id="overlay" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="desk-nav" id="desk-nav" hidden><button id="nav-up" aria-label="Previous card"></button><button id="nav-down" aria-label="Next card"></button><span id="nav-hint"></span></div>
</div>
