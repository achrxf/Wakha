<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1E1A2B;--ink-soft:#544C63;--ink-faint:#857D92;--brass-hi:#F3DC9C;--brass:#C9A24F;--brass-lo:#8E6A28;--grout:#EDE5D6;
 --font-display:"Bodoni Moda",Didot,"Bodoni 72",serif;--font-ui:"Readex Pro",system-ui,sans-serif;--font-ar:"Amiri",serif;--font-kufi:"Reem Kufi","Amiri",serif}
body{margin:0;background:#111;font-family:var(--font-ui);color:var(--ink)}
.stage{max-width:390px;margin:0 auto}
.chapter{position:relative;overflow:hidden;isolation:isolate;padding:34px 22px 34px;background:var(--wall)}
.chapter::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.55),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(0,0,0,.08),transparent 70%)}
.chapter::after{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--noise);opacity:.55;mix-blend-mode:multiply}
.stop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.stop small{font:500 12.5px/1 var(--font-ui);letter-spacing:.02em;color:var(--ink-soft)}
.city{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.city h2{margin:0;font:700 clamp(36px,12vw,48px)/.95 var(--font-display);font-variation-settings:"opsz" 96;letter-spacing:-.02em}
.city h2.long{font-size:clamp(32px,9.6vw,40px)}
.city .ar{font:600 30px/1 var(--font-kufi);color:var(--accent)}
.scene{margin:12px 0 0;font:400 15.5px/1.5 var(--font-ui);color:var(--ink-soft);max-width:30ch}
.panel{position:relative;margin:24px auto 0;width:min(100%,330px);aspect-ratio:1;background-image:var(--band);background-size:20px 20px;border-radius:3px;
  box-shadow:0 30px 50px -22px rgba(40,20,10,.55),0 2px 6px rgba(40,20,10,.18)}
.panel .inner{position:absolute;inset:10px;background:var(--niche);box-shadow:inset 0 0 0 1.5px #C9A24F,inset 0 10px 30px rgba(60,30,10,.18)}
.zel{position:relative;width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(60,30,10,.25))}
.zel .pc,.zel .field{fill:var(--k);stroke:#E9E0CF;stroke-width:1.15;stroke-linejoin:round;transition:fill .7s ease}
.zel .ring.done .pc,.zel .ring.deco .pc,.zel.any .field{fill:var(--g)}
.zel .field{stroke:none}
.zel .ring:not(.done):not(.deco) .sheen{opacity:0}
.zel .sheen{pointer-events:none;mix-blend-mode:screen;opacity:.8}
.zel .ring.current .pc{stroke:#B98E3A;stroke-width:1.8;animation:cur 1.6s ease-in-out infinite}
@keyframes cur{50%{stroke:#F3DC9C}}
.unit{margin-top:24px;display:flex;align-items:baseline;gap:12px}
.unit h3{margin:0;font:600 30px/1 var(--font-display);font-variation-settings:"opsz" 72;font-style:italic}
.unit span{font:400 14px/1.3 var(--font-ui);color:var(--ink-soft)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.tile{position:relative;aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font:700 26px/1 var(--font-display);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 8px 16px -8px rgba(40,20,10,.5)}
.tile.done{background:linear-gradient(140deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%,rgba(0,0,0,.12)),var(--t)}
.tile.current{background:#D7A88D;color:var(--ink);outline:2px solid var(--brass);outline-offset:3px}
.tile.locked{background:#D7A88D;color:rgba(30,26,43,.45)}
.tile small{position:absolute;bottom:6px;font:600 10px/1 var(--font-ui);color:inherit;opacity:.85}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;width:100%;min-height:58px;padding:0 20px;border:0;border-radius:14px;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass) 48%,var(--brass-lo));color:#2A1A04;font:600 16px/1 var(--font-ui);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.18),0 12px 24px -10px rgba(90,60,10,.6)}
.cta em{font:italic 600 17px/1 var(--font-display)}
.route{display:flex;align-items:center;gap:10px;padding:18px 22px;background:var(--ink);color:#EDE5D6;font:500 13px/1.3 var(--font-ui)}
.route i{flex:1;height:0;border-top:1.5px dashed rgba(237,229,214,.4)}
</style></head><body><div class="stage" id="s"></div>
<script src="../src/medallion.js"></script>
<script>
const noise=`url("data:image/svg+xml,${encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>")}")`;
document.documentElement.style.setProperty("--noise",noise);
const band=(a,b)=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><rect width='22' height='22' fill='${a}'/><path d='M11 2l2.6 6.4L20 11l-6.4 2.6L11 20l-2.6-6.4L2 11l6.4-2.6z' fill='${b}'/><circle cx='11' cy='11' r='2' fill='#EDE5D6'/></svg>`)}")`;
const C=[
 {n:"Stop 1",city:"Tangier",ar:"طنجة",wall:"#E7ECE9",niche:"#D5E0DC",accent:"#157A7A",g:["#13706F","#1F45B5","#E0A631"],scene:"You step off the ferry into Tangier. Time to say hello.",unit:"Salam",sub:"Hello and how are you",st:["done","current","locked","locked"]},
 {n:"Stop 2",city:"Chefchaouen",ar:"شفشاون",wall:"#9DBDE6",niche:"#B9CFEC",accent:"#22307A",g:["#23307A","#3B79C6","#F0E9DA"],scene:"Blue walls, quiet steps. Good manners open every door here.",unit:"Bla mzyya",sub:"Please, thanks and OK",st:["locked","locked","locked","locked"]},
 {n:"Stop 5",city:"Marrakech",ar:"مراكش",wall:"#DC9A80",niche:"#E7B39C",accent:"#8F2F1E",g:["#A3381F","#0E6B4E","#E0A631"],scene:"The red city. Somewhere in the souk, a vendor is waiting.",unit:"Ssou9",sub:"Shopping at the souk",st:["done","done","done"]},
];
document.getElementById("s").innerHTML=C.map((c,i)=>`<section class="chapter" style="--wall:${c.wall};--niche:${c.niche};--accent:${c.accent};--band:${band(c.g[0],c.g[2])}">
 <div class="stop"><small>${c.n}</small><small>${c.st.filter(x=>x==="done").length} of ${c.st.length} glazed</small></div>
 <div class="city"><h2 class="${c.city.length>9?"long":""}">${c.city}</h2><span class="ar">${c.ar}</span></div>
 <p class="scene">${c.scene}</p>
 <div class="panel"><span class="band"></span><span class="inner"></span><div style="position:absolute;inset:22px">${Zel.svg(c.g,c.st,{seed:i*31+5,cls:c.st.some(x=>x==="done")?"any":""})}</div></div>
 <div class="unit"><h3>${c.unit}</h3><span>${c.sub}</span></div>
 <div class="tiles">${c.st.map((s,k)=>`<div class="tile ${s}" style="--t:${c.g[k%3]}">${k+1}<small>${s==="done"?"★★★":s==="current"?"Next":""}</small></div>`).join("")}</div>
 ${c.st.includes("current")?`<button class="cta"><span>Continue</span><em>Lesson 2</em></button>`:""}
</section>${i<C.length-1?`<div class="route"><span>Next stop</span><i></i><span>${C[i+1].city}</span></div>`:""}`).join("");
</script></body></html>
